name: pristan-shared-hdfs

include:
  - path: ../infra/docker-compose.infra.yml

# Metadata of the NameNode and blocks of the DataNode (/data/dfs). The named volumes keep HDFS
# consistent with the metastore volumes after `docker compose down` / `up`; a clean HDFS
# needs `docker compose down -v`. Mounting /data also replaces the anonymous volume
# declared by `VOLUME /data` in the apache/hadoop base image.
volumes:
  hdfs-cluster-1-data:
    name: hdfs-cluster-1-data
  hdfs-cluster-2-data:
    name: hdfs-cluster-2-data

services:
  hdfs-cluster-1:
    build:
      context: ../sklad/hadoop
    container_name: hdfs-cluster-1
    hostname: hdfs-cluster-1
    restart: unless-stopped
    environment:
      CLUSTER_ID: "hdfs-cluster-1"
      CLUSTER_NAME: "Production DataLake"
    volumes:
      - ../sklad/hadoop/entrypoint.sh:/entrypoint.sh:ro
      - hdfs-cluster-1-data:/data
      - demo-shared-keytabs:/shared/keytabs:ro
      - demo-shared-krb5:/shared/conf:ro
    ports:
      - "9870:9870"
      - "9864:9864"
    depends_on:
      kdc:
        condition: service_healthy
    networks:
      demo-platform-net:
        aliases:
          - hdfs-cluster-1

  hdfs-cluster-2:
    build:
      context: ../sklad/hadoop
    container_name: hdfs-cluster-2
    hostname: hdfs-cluster-2
    restart: unless-stopped
    environment:
      CLUSTER_ID: "hdfs-cluster-2"
      CLUSTER_NAME: "Archive & Analytics DataLake"
    volumes:
      - ../sklad/hadoop/entrypoint.sh:/entrypoint.sh:ro
      - hdfs-cluster-2-data:/data
      - demo-shared-keytabs:/shared/keytabs:ro
      - demo-shared-krb5:/shared/conf:ro
    ports:
      - "9872:9870"
      - "9865:9864"
    depends_on:
      kdc:
        condition: service_healthy
    networks:
      demo-platform-net:
        aliases:
          - hdfs-cluster-2
